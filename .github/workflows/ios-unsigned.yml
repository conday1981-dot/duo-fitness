# DUO – unsigned IPA on GitHub's macOS runners (manual only).
#
# Fallback to codemagic.yaml, which is the main build (500 free macOS minutes
# a month there). Here, macOS minutes count 10x against a private repo's
# 2,000 free minutes, so one build uses roughly 150–250 of them.
# Same steps as codemagic.yaml; no signing, nothing published. The IPA is a
# workflow artifact named DUO-ipa.
name: iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tool versions
        run: |
          xcodebuild -version
          node -v
          pod --version

      - name: Install JavaScript packages
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the iOS project from app.json
        run: CI=1 npx expo prebuild --platform ios --clean --no-install

      - name: Stamp the build number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/DUO/Info.plist

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build (Release, device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -workspace ios/DUO.xcworkspace -scheme DUO -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || true
          grep -n -E -B2 -A8 "(error|fatal error):" build.log | head -300 || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Package the IPA and check what it asks for
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/DUO.app
          test -f "$APP/main.jsbundle" || { echo "JavaScript bundle missing from the app"; exit 1; }
          for key in NSHealthShareUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription UIBackgroundModes; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist" > /dev/null || { echo "Info.plist is missing $key"; exit 1; }
          done
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry DUO.ipa Payload
          ls -lh DUO.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DUO-ipa
          path: |
            DUO.ipa
            build.log
          if-no-files-found: warn
